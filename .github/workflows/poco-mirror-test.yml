name: Build PocoMirror test

on:
  push:
    paths:
      - 'poco-mirror/**'
      - '.github/workflows/poco-mirror-test.yml'
  workflow_dispatch:

jobs:
  build-launcher:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build launcher
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          where cl
          cl /O2 /utf-8 /DUNICODE /D_UNICODE poco-mirror\launcher.c /link /SUBSYSTEM:WINDOWS user32.lib comctl32.lib /OUT:PocoMirror.exe

      - name: Download official scrcpy runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = 'v4.1'
          $zipName = 'scrcpy-win64-v4.1.zip'
          $url = "https://github.com/Genymobile/scrcpy/releases/download/$version/$zipName"
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName
          $extractPath = Join-Path $env:RUNNER_TEMP 'scrcpy-extracted'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'dist\PocoMirror'

          Invoke-WebRequest -Uri $url -OutFile $zipPath
          $expected = '5b12172b3264b2889f4583ee64752ce832e29bc8b1089dca81093459697165db'
          $actual = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "SHA-256 de scrcpy no coincide. Esperado: $expected. Obtenido: $actual"
          }

          Remove-Item $extractPath -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:GITHUB_WORKSPACE 'dist') -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

          $scrcpyDir = Get-ChildItem $extractPath -Directory | Select-Object -First 1
          if (-not $scrcpyDir) { throw 'No se encontró el directorio del paquete scrcpy.' }

          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item (Join-Path $scrcpyDir.FullName '*') $stage -Recurse -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'PocoMirror.exe') $stage -Force

          if (-not (Test-Path (Join-Path $stage 'adb.exe'))) { throw 'El paquete final no contiene adb.exe.' }
          if (-not (Test-Path (Join-Path $stage 'scrcpy.exe'))) { throw 'El paquete final no contiene scrcpy.exe.' }

          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'PocoMirror-test.zip') -Force

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: PocoMirror-test
          path: PocoMirror-test.zip
