name: Build PocoMirror single EXE

on:
  push:
    paths:
      - 'poco-mirror/**'
      - '.github/workflows/poco-mirror-test.yml'
  workflow_dispatch:

jobs:
  build-single-exe:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official scrcpy runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $version = 'v4.1'
          $zipName = 'scrcpy-win64-v4.1.zip'
          $url = "https://github.com/Genymobile/scrcpy/releases/download/$version/$zipName"
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName

          Invoke-WebRequest -Uri $url -OutFile $zipPath

          $expected = '5b12172b3264b2889f4583ee64752ce832e29bc8b1089dca81093459697165db'
          $actual = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "SHA-256 de scrcpy no coincide. Esperado: $expected. Obtenido: $actual"
          }

          Copy-Item $zipPath (Join-Path $env:GITHUB_WORKSPACE $zipName) -Force

      - name: Create Windows resource file
        shell: powershell
        run: |
          @'
          #define IDR_RUNTIME_ZIP 3001
          IDR_RUNTIME_ZIP RCDATA "scrcpy-win64-v4.1.zip"
          '@ | Set-Content -Path poco-mirror\runtime.rc -Encoding ASCII

      - name: Build embedded resources
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          where rc
          rc /nologo /fo poco-mirror\runtime.res poco-mirror\runtime.rc
          if errorlevel 1 exit /b 1
          rc /nologo /fo poco-mirror\version.res poco-mirror\version.rc
          if errorlevel 1 exit /b 1

      - name: Build PocoMirror single executable
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          where cl
          cl /O2 /utf-8 /DUNICODE /D_UNICODE poco-mirror\launcher.c poco-mirror\runtime.res poco-mirror\version.res /link /SUBSYSTEM:WINDOWS user32.lib comctl32.lib /OUT:PocoMirror.exe
          if errorlevel 1 exit /b 1
          if not exist PocoMirror.exe exit /b 1

      - name: Verify single executable
        shell: powershell
        run: |
          $exe = Get-Item PocoMirror.exe
          if ($exe.Length -lt 10MB) {
            throw "PocoMirror.exe es demasiado pequeño: $($exe.Length) bytes"
          }

          $hash = (Get-FileHash PocoMirror.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "PocoMirror.exe SHA-256: $hash" | Out-File -FilePath PocoMirror-SHA256.txt -Encoding UTF8
          "Tamaño: $($exe.Length) bytes" | Add-Content PocoMirror-SHA256.txt

      - name: Upload single EXE
        uses: actions/upload-artifact@v4
        with:
          name: PocoMirror-single-exe
          path: |
            PocoMirror.exe
            PocoMirror-SHA256.txt
